        Supprime une inscription d'étudiant d'un groupe crédité selon l'information spécifiée.

         <p>
         Pour supprimer une inscription d'étudiant dans Brio, vous devez appeler cette API en précisant
         les informations de l'inscription et du groupe selon le format défini par les
         <code>SupprimerInscriptionGroupeFormationCrediteeParams</code>.

         S'il y a bien une inscription `idExterne` sur le groupe `idExterneGroupe`, pour l'utilisateur `idExterneUtilisateur`,
         l'inscription sera supprimée, sinon elle ne sera pas supprimée.
         </p>

         <p>
         <code>idExterne</code> : Identifiant de l'inscription de l'étudiant. Provient de votre système de gestion des études.<br>
         <code>idExterneUtilisateur</code> : Identifiant utilisateur de l'étudiant. Provient de votre système de gestion des études.<br>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idExterneGroupe</code> : Identifiant du groupe. Provient de votre système de gestion des études.<br>
         </p>

         ### Exemple (structure de base d'un appel)
         <pre><code>
         DELETE /formations/v1/formationscreditees/-/groupes/-/inscriptions/
              {
                  "idExterne":"888",
                  "idExterneUtilisateur":"333",
                  "idUniteOrganisation":"123",
                  "idExterneGroupe":"789"
              }
         </code></pre>

