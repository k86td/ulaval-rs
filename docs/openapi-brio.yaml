openapi: 3.0.1
info:
  title: API de gestion des formations
  description: "# Service de gestion des formations\nCette API regroupe les fonctions\
    \ pour gérer les formations dans Brio.\n ## Changelog \n[S'inscrire à l'infolettre\
    \ Changements Brio | API - Gestion des formations](http://eepurl.com/hoR-ED)\n\
    \nVoir [http://apis.brioeducation.ca/formations/openapi-changelog.html](http://apis.brioeducation.ca/formations/openapi-changelog.html)\n\
    \ ### Préalables\n Pour utiliser les API de Brio, vous aurez besoin d’un jeton\
    \ d’authentification permanent. Consultez le service Authentification pour en\
    \ savoir plus.\n"
  termsOfService: https://identites.brioeducation.ca/conditions-utilisation.html
  contact:
    name: Brio
    url: https://www.brioeducation.ca/
    email: aide@brioeducation.ca
  version: 61.9.0
externalDocs:
  description: Besoin d'aide?
  url: https://aide.brioeducation.ca/
servers:
- url: https://apis.brioeducation.ca/formations
  description: Serveur de production
tags:
- name: Gestion des participants - Formation continue
  description: API responsables de la gestion des participants de formation continue.
- name: Gestion site - Formation créditée
  description: API responsables de la gestion des sites de formation créditée.
- name: Imports en lot
  description: API responsable de la gestion des imports en lot.
paths:
  /formations/v1/formations/-/groupes/-/participants:changements:
    get:
      tags:
      - Gestion des participants - Formation continue
      summary: "Recherche les participants ayant été ajoutés, modifiés ou supprimé\
        s depuis un numéro de changement spécifique."
      description: |-
        Recherche les participants ayant été ajoutés, modifiés ou supprimés depuis un numéro de changement spécifique.

         L'API recherche tous les changements ayant un numéro strictement plus grand que <code>numerochangement</code> ordonnés par numéro de changement.
         Le numéro de changement `0` permet de recevoir la liste complète des participants.<br>

         ### Étape 1 : Rechercher tous les participants aux formations existantes pour votre organisation<br>

         Pour commencer, obtenez la liste complète des participants aux formations de votre organisation en utilisant les informations de connexion de votre Application Cliente.<br>

         `/formations/v1/formations/-/groupes/-/participants:changements?limite=100&numerochangement=0`<br>

         Notez le numéro de changement retourné (<code>numeroChangementPageSuivante</code>) pour l'étape suivante.<br>

         ### Étape 2 : Obtenir les derniers changements aux participants de vos formations<br>

         Une fois que vous avez un <code>numeroChangementPageSuivante</code> en main, vous pouvez rechercher tous les participants ayant été ajoutés, modifiés ou supprimés depuis la dernière fois.
         Ceci vous permet, entre autres, de mettre à jour votre système avec les changements effectués aux participants depuis le dernier appel au service.<br>

         `/formations/v1/formations/-/groupes/-/participants:changements?limite=100&numerochangement=XYZ`<br>

         Le serveur peut imposer une taille maximale. Donc, il sera peut-être nécessaire d'effectuer l'appel plusieurs fois (en mettant à jour le paramètre <code>numerochangement</code> à partir du champ <code>numeroChangementPageSuivante</code> de la réponse précédente). Le champ `dernierePage` sera à `true` s'il n'y a plus d'autres participants.<br>
      operationId: ca.ulaval.ena2.formations.apis.formations.groupes.participants.publique.ParticipantsFormationRestServicePublique.rechercherChangementsParticipants
      parameters:
      - name: limite
        in: query
        description: |-
          Permet de limiter le nombre de changements à retourner. Optionnel<br>

           Le serveur peut imposer une taille maximale.<br>

           Si non spécifié ou `0`, le serveur déterminera la valeur à utiliser.
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: numerochangement
        in: query
        description: Permet de filtrer les changements à ceux ayant un numéro de changement
          strictement plus grand que cette valeur. Spécifier `0` pour obtenir la première
          page de changements.
        required: true
        schema:
          minimum: 0
          type: integer
      - name: iduniteresponsableformation
        in: query
        description: L'identifiant de l'unité responsable des formations. Facultatif.
        schema:
          type: string
      responses:
        default:
          description: La liste des participants pour lesquels des changements ont
            eu lieu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatRechercheChangementsSommaireParticipantFormationChangement'
  /formations/formations/-/utilisateurs/{idexterneutilisateur}:
    get:
      tags:
      - Gestion site - Formation créditée
      summary: Obtient les informations rattachées à un utilisateur sur les formations
        créditées suivies ainsi que les sites de cours rattachés à ces formations.
      description: |-
        Obtient les informations rattachées à un utilisateur sur les formations créditées suivies ainsi que les sites de cours rattachés à ces formations.

         <p>
         Pour obtenir les formations créditées ainsi que les sites existants dans Brio, vous devez appeler cette API en précisant des informations selon le format
         défini par les <code>RechercherFormationsSitesUtilisateurParams</code>.<br>
         </p>

         <p>
         <code>idexterneutilisateur</code> : Identifiant de l'utilisateur. Provient de votre système de gestion des études.<br>
         <code>iduniteorganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idexternesession</code> : Identifiant de la session pour laquelle on cherchera les formations créditées et les sites de l'utilisateur. Provient de votre système de gestion des études.<br>
         <code>typesparticipation</code> : Type de participation de l'utilisateur(Ex: COURS_SUIVIS, COURS_ENSEIGNES). (Optionnel). <br>
         </p><br><br>

         ### Exemple (structure de base d'un appel):<br>
         <pre><code>
         GET formations/-/utilisateurs/123xyz?iduniteorganisation=abc456&idexternesession=202309&typesparticipation=COURS_SUIVIS
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X GET [URL] \
            -H 'Content-Type: application/json' \
         </code></pre>
      operationId: ca.ulaval.ena2.formations.apis.formations.utilisateurs.FormationsSitesUtilisateurRestService.rechercherFormationsSitesUtilisateur
      parameters:
      - name: idexterneutilisateur
        in: path
        description: Identifiant de l'utilisateur dans son organisation. Obligatoire.
        required: true
        schema:
          type: string
      - name: iduniteorganisation
        in: query
        description: Identifiant de l'organisation. Obligatoire.
        schema:
          type: string
      - name: idexternesession
        in: query
        description: Identifiant de session de la formation dans l'organisation. Obligatoire.
        schema:
          type: string
      - name: typesparticipation
        in: query
        description: Liste des types de participation à chercher. Optionnel.
        schema:
          type: array
          items:
            type: string
            description: Énumération des différents types de participation.
            enum:
            - COURS_SUIVIS
            - COURS_ENSEIGNES
            - _NON_SUPPORTE_
      responses:
        "200":
          description: Une liste des formations et sites de l'utilisateur correspondant
            aux critères de recherche reçus en paramètre.
          content:
            application/json:
              schema:
                type: object
                properties:
                  elements:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormationSiteUtilisateur'
        "400":
          description: |-
            La requête n'est pas valide. La raison sera documentée dans `erreursValidation`. Raisons possibles:
            <ul>
                <li>B00752: Le champ ne peut être vide.</li>
                <li>B00502: La ressource demandée n'existe pas.</li>
            </ul>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
  /formations/v1/formationscreditees/-/groupes/-/enseignants:
    put:
      tags:
      - Gestion site - Formation créditée
      summary: Crée ou modifie une affectation d'enseignant à un groupe crédité selon
        l'information spécifiée.
      description: |-
        Crée ou modifie une affectation d'enseignant à un groupe crédité selon l'information spécifiée.

         <p>
         Pour créer ou modifier une affectation d'enseignant dans Brio, vous devez appeler cette API en précisant les informations de
         l'enseignant et du groupe selon le format défini par les <code>EnseignantGroupeCrediteParams</code>.
         </p>

         <ul>
          <li>
              Si une affectation est trouvée dans le groupe à partir de l'<code>idExterneAffectation</code> fourni,
              elle est modifiée, sinon, une nouvelle affectation est créée.
          </li>
          <li>
              Pour créer une nouvelle affectation, le service vérifie l'existence de l'enseignant dans Brio à l'aide de
              l'<code>idExterneUtilisateur</code>, ou de l'adresse courriel fournie :
              <ul>
               <li>
                   Si l'enseignant est trouvé, il est affecté au groupe.
                   <br>
                   Note : Le nom et le prénom ne sont pas mis à jour pour un enseignant existant.
               </li>
               <li>
                   Si l'enseignant n'est pas trouvé, il est créé dans Brio à partir des données fournies, puis il est affecté au groupe.
               </li>
              </ul>
          </li>
         </ul>

         <p>
         <code>idExterneUtilisateur</code> : Identifiant utilisateur de l'enseignant à affecter. Provient de votre système de gestion des études.<br>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idExterneGroupe</code> : Identifiant du groupe à affecter. Provient de votre système de gestion des études.<br>
         <code>idExterneAffectation</code> : Identifiant de l'affectation de l'enseignant. Provient de votre système de gestion des études.<br>
         <code>typeCompte</code> : type de compte Brio que vous désirez créer. Utilisé pour créer des comptes SSO.  (Optionnel)<br>
         <code>identifiantConnexion</code> : dans le cas d'un type de compte SSO, il faut fournir l'identifiant de connexion
         <code>autresCourriels</code> : Sert uniquement à la recherche des doublons pour un utilisateur UL déjà existant dans Brio (Optionnel).
         utilisé par l'enseignant chez le fournisseur de connexion de votre organisation. (Optionnel)
         </p>
         <br/>

         <b>Particularité</b><br>
         Pour des raisons techniques, les tests d'API de ce service doivent se faire directement en production dans une organisation de test spécifique à chaque
         partenaire. Les utilisateurs créés via le service d'inscription doivent obligatoirement utiliser le domaine courriel inscrit dans le champ <code>domaineCourriel</code>
         de l'organisation de test. Le nombre d'utilisateurs pour chaque organisation de test est limité par défaut à 10.
         <br><br>

         ### Exemple (structure de base d'un appel):<br>
         <pre><code>
         PUT /formations/v1/formationscreditees/-/groupes/-/enseignants/
         {
              "idExterneUtilisateur":"333",
              "idUniteOrganisation":"123",
              "idExterneGroupe":"789",
              "idExterneAffectation":"101",
              "prenom":"Pierre",
              "nom":"Untel",
              "courriel":"pierre.untel@courriel.ca",
              "typeCompte": "SSO",
              "identifiantConnexion":"piunt@courriel.ca",
              "autresCourriels": [
                 "pierre.unAutre@autre.ca",
                 "p.untel@exemple.com"
             ]
         }
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X PUT [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
            {
              "idExterneUtilisateur": "333",
              "idUniteOrganisation":"123",
              "idExterneGroupe":"789",
              "idExterneAffectation":"101",
              "prenom":"Pierre",
              "nom":"Untel",
              "courriel":"pierre.untel@courriel.ca",
              "typeCompte": "SSO",
              "identifiantConnexion":"piunt@courriel.ca",
              "autresCourriels": [
                 "pierre.untel@autre.ca",
                 "p.untel@exemple.com"
             ]
            }
            EOF
         </code></pre>
      operationId: ca.ulaval.ena2.formations.apis.formationscreditees.enseignantspublic.EnseignantGroupeCreditePublicRestService.creerOuModifierEnseignant
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                idExterneUtilisateur:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant utilisateur de l'enseignant du groupe dans
                    votre système. Obligatoire.
                idUniteOrganisation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant Brio de l'unité organisation de l'enseignant.
                    Sera fourni par l'équipe Brio. Obligatoire.
                idExterneGroupe:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant du groupe crédité dans votre système. Obligatoire.
                idExterneAffectation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: |-
                    Identifiant de l'affectation de l'enseignant du groupe crédité dans votre système. Obligatoire.
                     <br>
                     Cet id est different de l'`idExterneUtilisateur`.
                prenom:
                  maxLength: 150
                  minLength: 1
                  type: string
                  description: Prénom de l'enseignant. Obligatoire.
                nom:
                  maxLength: 150
                  minLength: 1
                  type: string
                  description: Nom de l'enseignant. Obligatoire.
                courriel:
                  maxLength: 240
                  minLength: 1
                  type: string
                  description: |-
                    Courriel de communication de l'enseignant. Obligatoire.
                     <br>
                     Pour un utilisateur qui n'existe pas dans Brio, ce courriel sera utilisé comme courriel de connexion et par la suite il sera le courriel de communication.
                     <br>
                     Pour un utilisateur qui existe dans Brio, il sera le courriel de communication.
                typeCompte:
                  type: string
                  description: Type de compte de l'utilisateur dans le cas d'un type
                    de compte SSO. Optionnel.
                identifiantConnexion:
                  maxLength: 254
                  minLength: 1
                  type: string
                  description: Identifiant de connexion de l'utilisateur dans le cas
                    d'un type de compte SSO. Optionnel.
              description: |-
                Paramètres pour la création ou la modification d'un `EnseignantGroupeCredite`. <br>

                 Lorsqu'une affectation existe pour l'`idExterneAffectation` ou la combinaison d'`idExterneUtilisateur` et d'`idUniteOrganisation` spécifiée,
                 l'adresse courriel de communication de l'enseignant sera modifiée.

                 Dans le cas contraire, une nouvelle affectation sera créée.

                 Exemple:
                 <pre><code>
                 {
                      "idExterneUtilisateur":"333",
                      "idUniteOrganisation":"123",
                      "idExterneGroupe":"789",
                      "idExterneAffectation":"101",
                      "prenom":"Pierre",
                      "nom":"Untel",
                      "courriel":"pierre.untel@courriel.ca",
                      "typeCompte": "SSO",
                      "identifiantConnexion":"piunt@courriel.ca"
                 }
                 </code></pre>
      responses:
        "200":
          description: L'enseignant et son affectation (créée ou modifiée) sont retournés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnseignantGroupeCredite'
        "400":
          description: "La requête n'est pas valide. La raison sera documentée dans\
            \ `erreursValidation`. Raisons possibles: <ul><li>B00751: La taille doit\
            \ être comprise entre {min} et {max}.</li><li>B00752: Le champ ne peut\
            \ être vide.</li><li>B00754: Le type n'est pas supporté.</li><li>B20605:\
            \ L'unité organisation est inconnue.</li><li>B20609: L'unité organisation\
            \ spécifiée ne correspond pas à une organisation.</li><li>B20348: Impossible\
            \ d'ajouter un enseignant qui est déjà participant.</li><li>B20347: L'enseignant\
            \ est déjà affecté à ce groupe.</li><li>B20264: Groupe inexistant ou supprimé\
            .</li><li>B20194: L'utilisateur fourni (idExterneUtilisateur={id}) est\
            \ différent de celui actuellement associé à l'affectation (idExterneAffectation={id}).</li><li>B15069:\
            \ L'utilisateur fourni (idExterneUtilisateur={id}) est différent de celui\
            \ actuellement associé à l'adresse courriel fournie ({courriel}).</li><li>B00793:\
            \ La limite d'utilisateurs est atteinte pour l'organisation de test.</li><li>B00794:\
            \ Le domaine du courriel est invalide pour l'organisation de test.</li><li>B20197:\
            \ Impossible d'ajouter l'enseignant pour un type de compte SSO.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
    delete:
      tags:
      - Gestion site - Formation créditée
      summary: Supprime une affectation de l'enseignant sur un groupe crédité selon
        l'information spécifiée.
      description: |-
        Supprime une affectation de l'enseignant sur un groupe crédité selon l'information spécifiée.

         <p>
         Pour supprimer une affectation d'enseignant dans Brio, vous devez appeler cette API en précisant les
         informations de l'affectation et du groupe selon le format défini par les <code>SupprimerEnseignantGroupeCrediteParams</code>.
         </p>

         <p>
         S'il y a bien une affectation <code>idExterneAffectation</code> sur le groupe <code>idExterneGroupe</code>, pour l'utilisateur
         <code>idExterneUtilisateur</code>, l'affectation sera supprimée, sinon elle ne sera pas supprimée.
         </p>

         <p>
         <code>idExterneUtilisateur</code> : Identifiant utilisateur de l'enseignant. Provient de votre système de gestion des études.<br>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idExterneGroupe</code> : Identifiant du groupe. Provient de votre système de gestion des études.<br>
         <code>idExterneAffectation</code> : Identifiant de l'affectation de l'enseignant. Provient de votre système de gestion des études.
         </p>

         ### Exemple (structure de base d'un appel)
         <pre><code>
         DELETE /formations/v1/formationscreditees/-/groupes/-/enseignants/
             {
                  "idExterneUtilisateur":"333",
                  "idUniteOrganisation":"123",
                  "idExterneGroupe":"789",
                  "idExterneAffectation":"101"
             }
         </code></pre>

         ### Exemple cURL
         <pre><code>
         curl -X DELETE [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
             {
                  "idExterneUtilisateur":"333",
                  "idUniteOrganisation":"123",
                  "idExterneGroupe":"789",
                  "idExterneAffectation":"101"
             }
            EOF
         </code></pre>
      operationId: ca.ulaval.ena2.formations.apis.formationscreditees.enseignantspublic.EnseignantGroupeCreditePublicRestService.supprimerEnseignant
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                idExterneUtilisateur:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant de l'enseignant. Provient de votre système
                    de gestion des études. Obligatoire.
                idUniteOrganisation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant de votre organisation. Provient de Brio
                    et sera fourni par l'équipe Brio. Obligatoire.
                idExterneGroupe:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant du groupe. Provient de votre système de
                    gestion des études. Obligatoire.
                idExterneAffectation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: |-
                    Identifiant de l'affectation de l'enseignant. Provient de votre système de gestion des études. Obligatoire.
                     <br>
                     Cet id est different de l'`idExterneUtilisateur`.
              description: |-
                Les paramètres pour supprimer un enseignant d'un groupe crédité.
                 <br>
                 Exemple:
                 <pre><code>
                 {
                      "idExterneUtilisateur":"333",
                      "idUniteOrganisation":"123",
                      "idExterneGroupe":"789",
                      "idExterneAffectation":"101"
                 }
                 </code></pre>
      responses:
        "200":
          description: Retourne `ResultatSuppression` avec le nombre d'affectations
            supprimées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatSuppression'
        "400":
          description: "La requête n'est pas valide. La raison sera documentée dans\
            \ `erreursValidation`. Raisons possibles: <ul><li>B00751: La taille doit\
            \ être comprise entre {min} et {max}.</li><li>B00752: Le champ ne peut\
            \ être vide.</li><li>B00754: Le type n'est pas supporté.</li><li>B20605:\
            \ L'unité organisation est inconnue.</li><li>B20609: L'unité organisation\
            \ spécifiée ne correspond pas à une organisation.</li><li>B20264: Groupe\
            \ inexistant ou supprimé.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
  /formations/v1/formationscreditees/-/groupes/-/inscriptions:
    put:
      tags:
      - Gestion site - Formation créditée
      summary: Crée ou modifie une inscription à un groupe crédité selon l'information
        spécifiée.
      description: |-
        Crée ou modifie une inscription à un groupe crédité selon l'information spécifiée.

         <p>
         Pour créer ou modifier une inscription dans Brio, vous devez appeler cette API en précisant les informations
         de l'inscription et du groupe selon le format défini par les <code>InscriptionGroupeFormationCreditee</code>.

         <ul>
             <li>
                 Si une inscription est trouvée dans le groupe à partir de l'<code>idExterne</code> fourni, elle est
                 modifiée, sinon, une nouvelle inscription est créée.
             </li>
             <li>
                  Pour créer une nouvelle inscription, le service vérifie l'existence de l'étudiant dans Brio à l'aide
                  de l'<code>idExterneUtilisateur</code>, ou de l'adresse courriel fournie :
                  <ul>
                      <li>
                          Si l'étudiant est trouvé, il est inscrit dans le groupe.
                          <br/>
                          Note : Le nom et le prénom ne sont pas mis à jour pour un étudiant existant.
                      </li>
                      <li>
                          Si l'étudiant n'est pas trouvé, il est créé dans Brio à partir des données fournies, puis il est inscrit dans le groupe.
                      </li>
                  </ul>
             </li>
         </ul>
         </p>

         <p>
         <code>idExterne</code> : Identifiant de l'inscription de l'étudiant. Provient de votre système de gestion des études.<br>
         <code>idExterneUtilisateur</code> : Identifiant utilisateur de l'étudiant à inscrire. Provient de votre système de gestion des études.<br>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idExterneGroupe</code> : Identifiant du groupe dans lequel une inscription doit être ajoutée. Provient de votre système de gestion des études.<br>
         <code>statutInscription</code> : Statut de l'inscription.<br>
         <code>profilEtudiant</code> : Profil de l'étudiant.<br>
         <code>resultatFinalOfficiel</code> : Résultat final de l'étudiant lorsque le résultat apparaît au relevé de notes (officialisé). Utilisé pour les formations créditées de l'Université Laval. (Optionnel).<br>
         <code>numeroDossier</code> : Numéro de dossier de l'étudiant dans votre système de gestion des études (ex. : le NI pour l'Université Laval ou le matricule pour les Cégeps).<br>
         <code>typeCompte</code> : type de compte Brio que vous désirez créer. Utilisé pour créer des comptes SSO.  (Optionnel)<br>
         <code>identifiantConnexion</code> : dans le cas d'un type de compte SSO, il faut fournir l'identifiant de connexion utilisé par l'étudiant chez le fournisseur de connexion de votre organisation. (Optionnel)
         <code>autresCourriles</code> : Sert uniquement à la recherche des doublons pour un utilisateur UL déjà existant dans Brio (Optionnel).
         </p><br>

         <b>Particularité</b><br>
         Pour des raisons techniques, les tests d'API de ce service doivent se faire directement en production dans une organisation de test spécifique à chaque
