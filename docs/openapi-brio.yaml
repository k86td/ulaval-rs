              "idUniteOrganisation":"123",
              "idExterne":"001"
         }
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X DELETE [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
            {
              "idUniteOrganisation":"123",
              "idExterne":"001"
            }
            EOF
         </code></pre>
