    put:
      tags:
      - Gestion site - Formation créditée
      summary: Crée ou modifie un groupe pour une formation créditée selon l'information
        spécifiée.
      description: |-
        Crée ou modifie un groupe pour une formation créditée selon l'information spécifiée.

         <p>
         Pour créer ou modifier un groupe pour une formation créditée dans Brio, vous devez appeler cette API en précisant les
         informations du groupe selon le format défini par les <code>GroupeFormationCrediteeParams</code>.
         </p>

         <p>
         Cette API effectuera une recherche dans les groupes crédités existants à partir des valeurs <code>idExterne</code> et <code>idOrganisation</code>
         qui ont été spécifiées. Si un groupe crédité est trouvé, il sera modifié, sinon un nouveau groupe crédité sera créé.
         </p>

         <p>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio<br>
         <code>idUniteResponsable</code> : Identifiant de l'unité responsable du groupe. Provient de Brio.<br>
         <code>idExterne</code> : Identifiant du groupe. Provient de votre système de gestion des études.<br>
         <code>idExterneSession</code> : Identifiant de la session. Provient de votre système de gestion des études.<br>
         <code>idExterneFormation</code> : Identifiant de la formation. Provient de votre système de gestion des études.<br>
         </p>

         #### Exemple (structure de base d'un appel):<br>
         <pre><code>
         PUT /formations/v1/formationscreditees/-/groupes
         {
              "code":"123",
              "idUniteOrganisation":"123",
              "idUniteResponsable":"456",
              "idExterne":"789",
              "idExterneSession":"321",
              "idExterneFormation":"001",
              "horodateDebut": "2022-09-01T18:00",
              "horodateFin": "2022-12-20T18:59",
              "sectionCours": "aa1",
              "modeNotation": "SUCCES_ECHEC",
              "nombreCredits": "10",
              "description": "Nombre d'heures de présence",
              "nombreHeuresClasse": "120",
              "nombreHeuresLaboratoire": "100",
              "nombreHeuresTravailPersonnel": "120",
              "formuleEnseignementGroupe": "EN_LIGNE"
         }
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X PUT [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
            {
                "code":"123",
                "idUniteOrganisation":"123",
                "idUniteResponsable":"456",
                "idExterne":"789",
                "idExterneSession":"321",
                "idExterneFormation":"001",
                "horodateDebut": "2022-09-01T18:00",
                "horodateFin": "2022-12-20T18:59",
                "sectionCours": "aa1",
                "modeNotation": "SUCCES_ECHEC",
                "nombreCredits": "10",
                "description": "Nombre d'heures de présence",
                "nombreHeuresClasse": "120",
                "nombreHeuresLaboratoire": "100",
                "nombreHeuresTravailPersonnel": "120",
                "formuleEnseignementGroupe": "EN_LIGNE"
            }
            EOF
         </code></pre>
      operationId: ca.ulaval.ena2.formations.apis.formationscreditees.groupes.publique.GroupesFormationCrediteeRestServicePublique.creerOuModifierGroupeFormationCreditee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  maxLength: 18
                  minLength: 1
                  type: string
                  description: Code du groupe de la formation créditée. Obligatoire.
                idUniteOrganisation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant de votre organisation. Provient de Brio
                    et sera fourni par l'équipe Brio. Obligatoire.
                idUniteResponsable:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: |-
                    Identifiant de l'unité responsable du groupe de la formation créditée. Provient de Brio et sera fourni par l'équipe Brio. Obligatoire.
                     L'unité doit faire partie des unités responsables de la formation créditée liée au groupe.
                idExterne:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant du groupe de la formation créditée. Provient
                    de votre système de gestion des études. Obligatoire.
                idExterneSession:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant de la session de la formation créditée.
                    Provient de votre système de gestion des études. Obligatoire.
                idExterneFormation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant de la formation créditée. Provient de votre
                    système de gestion des études. Obligatoire.
                horodateDebut:
                  type: string
                  description: |-
                    Date et heure de début de la formation créditée en format local (sans décalage horaire). Obligatoire.
                     La date horodateDebut doit être inférieure à la date horodateFin.<br>

                     Le décalage horaire est basé sur le fuseau horaire "America/Toronto".
                  format: date-time
                horodateFin:
                  type: string
                  description: |-
                    Date et heure de fin de la formation créditée en format local (sans décalage horaire). Obligatoire.
                     La date horodateFin doit être supérieure à la date horodateDebut.<br>

                     Le décalage horaire est basé sur le fuseau horaire "America/Toronto".
                  format: date-time
                sectionCours:
                  type: string
                  description: Section du cours de la formation. Optionnel.
                modeNotation:
                  type: string
                  description: |-
                    Le mode de notation du groupe. Obligatoire.<br>
                     Le mode de notation (aussi appelé système de notation) permet de spécifier sous quelle forme sera le résultat final.
                     Il sera transféré dans le site de formation et, selon sa valeur, un barème de conversion ou une note de passage peut être défini afin de convertir
                     automatiquement la note cumulée de l'étudiant en résultat final.<br><br>

                     Pour un mode de notation « Note pourcentage », le résultat final du cours sera une note en pourcentage.<br><br>

                     Pour un mode de notation « Succès / Échec », une note de passage pourrait être définie dans le site afin de convertir la note cumulée en succès ou en échec.<br><br>

                     Pour un mode de notation « Lettré » ou « Lettré 2-3e cycle », un barème de conversion pourrait être défini afin de convertir automatiquement la note cumulée en lettre selon les intervalles définis pour chaque lettre.<br><br>
                  enum:
                  - SUCCES_ECHEC
                  - LETTRE
                  - LETTRE_2E_3E_CYCLE
                  - NOTE_POURCENTAGE
                nombreCredits:
                  type: number
                  description: Nombre de crédits pour ce groupe (correspond au nombre
                    d'unités pour les cégeps).
                description:
                  type: string
                  description: La description du groupe.
                nombreHeuresClasse:
                  type: number
                  description: |-
                    Nombre d'heures de présence par semaine consacrées à l\u2019enseignement magistral,
                     à une conférence, à un séminaire ou à des rencontres de tous les étudiants et étudiantes de ce groupe.
                nombreHeuresLaboratoire:
                  type: number
                  description: |-
                    Nombre d'heures de présence par semaine consacrées à des rencontres étudiantes ou à l\u2019exécution de travaux pratiques,
                     de répétitions ou de projets dans des locaux spécialisés en petits groupes.
                nombreHeuresTravailPersonnel:
                  type: number
                  description: |-
                    Nombre d'heures par semaine que l\u2019étudiante ou l'étudiant consacre en moyenne
                     pour accomplir du travail personnel en lien avec le cours qu\u2019elle ou il suit.
                formuleEnseignementGroupe:
                  type: string
                  description: Formule d'enseignement du groupe.
                  enum:
                  - EN_SALLE
                  - EN_LIGNE
                  - HYBRIDE
                  - COMODALE
              description: |-
                Paramètres pour la création ou la modification d'un `GroupeFormationCreditee`. <br>

                 Lorsqu'un groupe de la formation créditée existe pour la combinaison d'`idExterne` et d'`idUniteOrganisation` spécifiée,
                 ce groupe sera mis à jour. Dans le cas contraire, un nouveau groupe sera créé.<br>

                 Exemple:
                 <pre><code>
                 {
                     "code":"123",
                     "idUniteOrganisation":"123",
                     "idUniteResponsable":"456",
                     "idExterne":"789",
                     "idExterneSession":"321",
                     "idExterneFormation":"001",
                     "horodateDebut": "2022-09-01T08:00",
                     "horodateFin": "2022-12-20T18:00",
                     "sectionCours": "aa1",
                     "modeNotation": "SUCCES_ECHEC",
                     "nombreCredits": "10",
                     "description": "Nombre d'heures de présence",
                     "nombreHeuresClasse": "120",
                     "nombreHeuresLaboratoire": "100",
                     "nombreHeuresTravailPersonnel": "120",
                     "formuleEnseignementGroupe": "COMODALE"
                 }
                 </code></pre>
      responses:
        "200":
          description: Le groupe de la formation créditée créé ou modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupeFormationCreditee'
        "400":
          description: "La requête n'est pas valide. La raison sera documentée dans\
            \ `erreursValidation`. Raisons possibles: <ul><li>B00751: La taille doit\
            \ être comprise entre {min} et {max}.</li><li>B00752: Le champ ne peut\
            \ être vide.</li><li>B00754: Le type n'est pas supporté.</li><li>B20004:\
            \ L'unité responsable est inconnue.</li><li>B20605: L'unité organisation\
            \ est inconnue.</li><li>B20606: La formation créditée est inexistante.</li><li>B20607:\
            \ La session de formation créditée est inexistante.</li><li>B20608: L'unité\
            \ responsable n'existe pas dans la liste des unités responsables de la\
            \ formation créditée.</li><li>B20609: L'unité organisation spécifiée ne\
            \ correspond pas à une organisation.</li><li>B20611: La date de fin doit\
            \ être supérieure à la date de début.</li><li>B20624: Impossible de modifier\
            \ l'unité responsable d'un groupe si un site de formation lui est associé\
            .</li><li>B20627: Impossible de modifier le mode de notation d'un groupe\
            \ si un site de formation lui est associé</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
