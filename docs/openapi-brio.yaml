         <p>
         Pour supprimer une formation créditée dans Brio, vous devez appeler cette API en précisant les paramètres de suppression selon le format
         défini par les <code>SupprimerFormationCrediteeParams</code>.<br>
         </p>

         <p>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idExterne</code> : Identifiant de la formation. Provient de votre système de gestion des études.<br>
