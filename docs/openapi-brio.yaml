  /formations/v1/formationscreditees:
    put:
      tags:
      - Gestion site - Formation créditée
      summary: Crée ou modifie une formation créditée selon l'information spécifiée.
      description: |-
        Crée ou modifie une formation créditée selon l'information spécifiée.

         <p>
         Pour créer ou modifier une formation créditée dans Brio, vous devez appeler cette API en précisant les informations de la formation selon le format
         défini par les <code>FormationCrediteeParams</code>.<br>
         </p>

         <p>
         Cette API effectuera une recherche dans les formations créditées existantes à partir des valeurs <code>idExterne</code> et
         <code>idUniteOrganisation</code> qui ont été spécifiées. Si une formation créditée est trouvée, elle sera modifiée, sinon une nouvelle
         formation créditée sera créée.
         </p>

         <p>
         Lorsqu'une formation créditée a déjà été envoyée à l'API, son <code>typeStructure</code> devient <b>non modifiable</b>.
         Si un changement de type de structure est nécessaire, la formation existante doit être <b>supprimée</b> de l'API,
         puis <b>recréée et synchronisée</b> avec le nouveau type.
         </p>

         <p>
         <code>idExterne</code> : Identifiant de la formation créditée. Provient de votre système de gestion des études.<br>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio.<br>
         <code>idsUnitesResponsables</code> : Identifiants des unités responsables de la formation créditée. Provient de Brio.<br>
         <code>codeLangue</code> : Code de la langue de la formation créditée. Si cette information est absente, le code de la langue par défaut de votre organisation sera utilisé.<br>
         <code>code</code> : Code unique de la formation créditée.<br>
         <code>nom</code> : Nom de la formation créditée.<br>
         <code>description</code> : Description de la formation créditée (optionnel)<br>
         <code>typeStructure</code> : Permet d'identifier le type de formation créditée (optionnel).<br>
         <code>formationDistance</code> : Informations spécifiques aux formations créditées envoyées au répertoire des formations à distance (optionnel).<br>
         <ul>
           <li><code>nombreCredits</code> : Nombre de crédits ou d'unités de la formation créditée (optionnel).</li>
           <li><code>urlExterne</code> : URL externe associée à la formation créditée (optionnel).</li>
           <li><code>entierementDistance</code> : Indique si la formation créditée est offerte entièrement à distance (optionnel).</li>
           <li><code>inscriptionEnContinu</code> : Indique si l'inscription à la formation créditée peut se faire en tout temps (optionnel).</li>
           <li><code>niveauxFormation</code> : Liste des niveaux de formation associés à la formation créditée (optionnel).</li>
           <li><code>idsExterneDomaine</code> : Liste des identifiants externes des domaines associés à la formation créditée (optionnel).</li>
           <li><code>formulesEnseignement</code> : Liste des modes de formation associés à la formation créditée (optionnel).</li>
         </ul>
         </p>

         #### Exemple (structure de base d'un appel):<br>
         <pre><code>
         PUT /formations/v1/formationscreditees/
         {
              "idUniteOrganisation": "123",
              "idExterne": "001",
              "code": "B-Sc",
              "nom": "Baccalauréat en actuariat",
              "idsUnitesResponsables": ["123", "456"],
              "codeLangue": "FR",
              "description": "Ce baccalauréat vous permettra de devenir une professionnelle ou un professionnel de l'analyse et du traitement des incidences financières du risque. Ainsi, vous mettrez à profit vos aptitudes pour les mathématiques et votre esprit créatif pour résoudre des problèmes financiers et sociaux.",
              "typeStructure": "PROGRAMME_AVEC_ACTIVITES",
              "formationDistance": {
                 "nombreCredits": 90,
                 "urlExterne": "https://www.ulaval.ca/etudes/programmes/baccalaureat-en-actuariat",
                 "entierementDistance": true,
                 "inscriptionEnContinu": false,
                 "niveauxFormation": [
                     "PROGRAMME_UNIVERSITAIRE_1ER_CYCLE",
                 ],
                 "idsExterneDomaine": [
                     "ADMN",
                     "EDUC",
                     "SANT"
                  ],
                  "formulesEnseignement":[
                     "EN_LIGNE",
                     "COMODALE"
                  ]
               }
         }
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X PUT [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
            {
                "idUniteOrganisation":"123",
                "idExterne": "001",
                "code": "B-Sc",
                "nom": "Baccalauréat en actuariat",
                "idsUnitesResponsables": ["123", "456"],
                "codeLangue": "FR",
                "description": "Ce baccalauréat vous permettra de devenir une professionnelle ou un professionnel de l'analyse et du traitement des incidences financières du risque. Ainsi, vous mettrez à profit vos aptitudes pour les mathématiques et votre esprit créatif pour résoudre des problèmes financiers et sociaux.",
                "typeStructure": "PROGRAMME_AVEC_ACTIVITES",
                "formationDistance": {
                       "nombreCredits": 90,
                       "urlExterne": "https://www.ulaval.ca/etudes/programmes/baccalaureat-en-actuariat",
                       "entierementDistance": true,
                       "inscriptionEnContinu": false,
                       "niveauxFormation": [
                           "PROGRAMME_UNIVERSITAIRE_1ER_CYCLE",
                       ],
                      "idsExterneDomaine": [
                           "ADMN",
                           "EDUC",
                           "SANT"
                      ],
                      "formulesEnseignement":[
                           "EN_LIGNE",
                           "COMODALE"
                      ]
                 }
            }
            EOF
         </code></pre>
