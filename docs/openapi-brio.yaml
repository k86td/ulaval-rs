            \ pour un lot en mode incrémental.</li><li>B20562: Le type de lot {TypeLot}\
            \ en mode {ModeImport} n'est pas supporté.</li><li>B20610: Il est impossible\
            \ de retirer la ou les unités responsables puisqu'elles sont rattaché\
            es à un groupe. Les unités en erreur sont: [liste des identifiants d'unité\
            \ en erreur].</li><li>B20564: L'identifiant externe de l'ensemble (session\
            \ ou groupe) (idExterneEnsembleDifferentiel) est obligatoire en mode diffé\
            rentiel.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
  /formations/v1/lots/{idlot}:
    get:
      tags:
      - Imports en lot
      summary: Obtient les informations d'un lot avec ses statistiques de traitement.
      description: |-
        Obtient les informations d'un lot avec ses statistiques de traitement.

         <p>
         Cette API récupère les informations détaillées du lot (<code>idLot</code>) et les statistiques globales de ses opérations.
         </p>
         Pour le lot en état <code>RECEPTION_EN_COURS</code> ou <code>EN_ATTENTE</code>, l'API retourne :
         <ul>
             <li>Les détails sur le lot, par exemple son id.</li>
             <li>Le nombre d'opérations reçues pour l'importation.</li>
         </ul>
         Pour tout autre état, l'API retourne :<br>
         <ul>
             <li>Les détails sur le lot.</li>
             <li>Le nombre d'opérations reçues pour l'importation de ce lot.</li>
             <li>Le nombre d'opérations en attente de traitement.</li>
             <li>Le nombre d'opérations en erreur.</li>
             <li>Le nombre d'opérations traitées avec succès.</li>
             <li>Le nombre de ressources créées.</li>
             <li>Le nombre de modifications apportées.</li>
             <li>Le nombre de ressources supprimées.</li>
             <li>Le nombre d'opérations non traitées.</li>
         </ul>

         ### Exemple (structure de base d'un appel):<br>
         `GET /formations/v1/lots/abcd1234/`<br>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X GET [URL] \
            -H 'Content-Type: application/json' \
         </code></pre>
      operationId: ca.ulaval.ena2.formations.apis.lots.LotsRestService.obtenirLot
      parameters:
      - name: idlot
        in: path
        description: |-
          Identifiant du lot à obtenir. Obligatoire.

           <i>maxLength: 50</i><br>
           <i>minLength: 1</i>
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Les détails sur le lot et les statistiques globales de ses
            opérations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lot'
        "400":
          description: "La requête n'est pas valide. La raison sera documentée dans\
            \ `erreursValidation`. Raisons possibles: <ul><li>B00752: Le champ ne\
            \ peut être vide.</li><li>B00502: La ressource demandée n'existe pas.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
  /formations/v1/lots/{idlot}:rechercheroperations:
    get:
      tags:
      - Imports en lot
      summary: Obtient les détails sur les opérations d'un lot avec le(s) statut(s)
        recherché(s).
      description: "Obtient les détails sur les opérations d'un lot avec le(s) statut(s)\
        \ recherché(s).\n\n <p>\n Cette API récupère les informations détaillées des\
        \ opérations qui composent le lot (<code>idLot</code>). Il offre la possibilité\
        \ de filtrer les\n opérations retournées par etatoperation. Si l'etatoperation\
        \ n'est pas spécifié, le service retourne tous les états disponibles.\n Il\
        \ est également possible de trier et de paginer les opérations retournées.\
        \ Par défaut, elles sont triées par etatoperation en ordre ascendant (ASC).\
        \ \n </p>\n\n ### Exemple (structure de base d'un appel):<br>\n `GET /formations/v1/lots/abcd1234:rechercheroperations?etatsoperation=SUCCES&etatsoperation=ERREUR&tri=etatoperation\
        \ ASC,dateCreation`<br>\n\n #### Exemple d'un appel fait avec cURL :<br>\n\
        \ <pre><code>\n curl -X GET [URL] \\\n    -H 'Content-Type: application/json'\
        \ \\\n </code></pre>"
      operationId: ca.ulaval.ena2.formations.apis.lots.LotsRestService.rechercherOperations
      parameters:
      - name: idlot
        in: path
        description: |-
          Identifiant du lot sur lequel on veut faire une recherche.

           <i>maxLength: 50</i><br>
           <i>minLength: 1</i>
        required: true
        schema:
          type: string
      - name: etatsoperation
        in: query
        description: |-
          États des opérations pour lesquelles on veut faire une recherche.<br>
           En l'absence du paramètre, tous les états possibles sont retournés par la recherche.
        schema:
          type: array
          items:
            type: string
            description: Énumération des différents états de traitement d'une opération.
            enum:
            - EN_ATTENTE
            - EN_COURS
            - SUCCES
            - ERREUR
            - NON_TRAITEE
      - name: position
        in: query
        description: |-
          Permet d'identifier la position du premier résultat à retourner.<br>

           La position peut être un nombre identifiant l'index du premier résultat ou elle peut
           être la valeur retournée par `ResultatRecherche#positionPageSuivante` afin d'obtenir la page suivante.

           Si le paramètre n'est pas spécifié, le service retourne les résultats au début de la liste.<br>
        schema:
          type: integer
          format: int32
      - name: taillepage
        in: query
        description: |-
          Permet de limiter le nombre de résultats à retourner.<br>
           <br>
           Le serveur peut imposer une taille maximale.<br>
           <br>
           Si null ou 0, le serveur détermine la valeur à utiliser.<br>
           <br>
           Si la valeur de `RechercherParams#SANS_PAGINATION` est utilisée et que le serveur n'impose pas de taille maximale,
           tous les résultats seront retournés dans la même page. Sinon le serveur détermine la valeur à utiliser.
        schema:
          type: integer
          format: int32
      - name: tri
        in: query
        description: |-
          Permet de trier la recherche selon les propriétés souhaitées.<br>

           La syntaxe utilisée est une liste de propriétés séparées par une virgule.<br>
           L'ordre du tri d'une propriété peut être défini en spécifiant l'une des valeurs suivantes après le nom : asc (ascendant) ou desc (descendant).
           Si une autre valeur est fournie, une erreur est retournée indiquant que la valeur n'est pas reconnue.
           L'ordre par défaut est « asc ».<br>


           Ex: dateCreation desc<br>

           Si aucune propriété de tri n'est spécifiée, le comportement dépend du service. Il peut imposer un tri, retourner une page aléatoire ou lancer une exception.
        schema:
          type: object
          properties:
            elementsTri:
              type: array
              items:
                $ref: '#/components/schemas/ElementTri'
            empty:
              type: boolean
          description: |-
            Représente une liste d'éléments de tri.

             Cette liste peut être utilisée afin de déterminer l'ordre et les champs à utiliser lors du tri d'éléments dans une requête
          enum:
          - etatOperation
          - dateCreation
          - dateDerniereModification
      responses:
        "200":
          description: Les opérations regroupées.
          content:
            application/json:
              schema:
                description: "Varie selon le type du lot.<br><code>OperationFormationCreditee</code>\
                  \ : pour les lots concernant les ressources de type formation cré\
                  ditée.<br><code>OperationGroupeFormationCreditee</code> : pour les\
                  \ lots concernant les ressources de type groupe d'une formation\
                  \ créditée. <br><code>OperationInscriptionGroupeFormationCreditee</code>\
                  \ : pour les lots concernant les ressources de type inscription\
                  \ à un groupe d'une formation créditée. <br><br>"
                oneOf:
                - $ref: '#/components/schemas/ResultatRechercheOperationFormationCreditee'
                - $ref: '#/components/schemas/ResultatRechercheOperationGroupeFormationCreditee'
                - $ref: '#/components/schemas/ResultatRechercheOperationInscriptionGroupeFormationCreditee'
        "400":
          description: "La requête n'est pas valide. La raison sera documentée dans\
            \ `erreursValidation`. Raisons possibles: <ul><li>B00751: La taille doit\
            \ être comprise entre {min} et {max}.</li><li>B00752: Le champ ne peut\
            \ être vide.</li><li>B00754: Le type n'est pas supporté.</li><li>B00502:\
            \ La ressource demandée n'existe pas.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
