                $ref: '#/components/schemas/ErreurValidation'
  /formations/v1/credites:reinitialiser:
    post:
      tags:
      - Gestion site - Formation créditée
      summary: Réinitialise les données d'une organisation de test.
      description: |-
        Réinitialise les données d'une organisation de test.

         <p>
         Pour réinitialiser les données d'une organisation de test des API de formations créditées
         dans Brio, vous devez appeler cette API en précisant le paramètre de l'organisation
         selon le format défini par les  <code>ReinitialiserDonneesCrediteesParams</code>.<br>
         </p>

         <p>
         Cette API supprime des données reliées à l'identifiant <code>idUniteOrganisation</code> spécifié.
         </p>

         <p>
         <code>idUniteOrganisation</code> : Identifiant de l'organisation de test des API de formations créditées. Provient de Brio.<br>
         </p>

         <p>
         Données réinitialisées :
         <ul>
         <li>Les inscriptions des étudiants;</li>
         <li>Les affectations des enseignants;</li>
         <li>Les groupes;</li>
         <li>Les sessions;</li>
         <li>Les cours;</li>
         <li>Les lots importés et leurs opérations.</li>
         </ul>
         Note : Les utilisateurs de l'organisation de test et leurs comptes associés ne seront pas réinitialisés.
         </p>

         #### Exemple (structure de base d'un appel):<br>
         <pre><code>
         POST /formations/v1/credites:reinitialiser
         {
              "idUniteOrganisation":"123"
         }
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X POST [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
            {
              "idUniteOrganisation":"123"
            }
            EOF
         </code></pre>
      operationId: ca.ulaval.ena2.formations.apis.formationscrediteespublic.ReinitialisationDonneesCrediteesPublicRestService.reinitialiserDonneesCreditees
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idUniteOrganisation:
                  maxLength: 50
                  minLength: 1
                  type: string
                  description: Identifiant de l'organisation de test des API de formations
                    créditées. Provient de Brio et sera fourni par l'équipe Brio.
                    Obligatoire.
              description: |-
                Paramètres pour la réinitialisation des données d'une organisation de test <code>idUniteOrganisation</code><br/>

                 Exemple:
                 <pre><code>
                 {
                     "idUniteOrganisation":"123"
                 }
                 </code></pre>
      responses:
        "200":
          description: Le message de confirmation de la réinitialisation des données
            ou le message indiquant l'absence de données à réinitialiser.
          content:
            application/json:
              schema:
                type: string
        "400":
          description: "La requête n'est pas valide. La raison sera documentée dans\
            \ `erreursValidation`. Raisons possibles: <ul><li>B00751: La taille doit\
            \ être comprise entre {min} et {max}.</li><li>B00752: Le champ ne peut\
            \ être vide.</li><li>B20605: L'unité organisation est inconnue.</li><li>B20609:\
            \ L'unité organisation spécifiée ne correspond pas à une organisation.</li><li>B20621:\
            \ L'organisation n'est pas une organisation de test.</li><li>B20622: L'organisation\
            \ ne peut être réinitialisée.</li></ul>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurValidation'
  /formations/v1/lots:
    post:
      tags:
      - Imports en lot
      summary: Importe un lot selon l'information spécifiée.
      description: |-
        Importe un lot selon l'information spécifiée.

         <p>Cette API importe les ressources en lot, selon l'information spécifiée. Le traitement des lots se fait en asynchrone. Après avoir ajouté les opérations
         à un lot, l'information minimale du lot sera immédiatement retournée par l'API. Pour connaître l'avancement du traitement, il faudra interroger l'API pour
         obtenir les informations d'un lot avec ses statistiques de traitement ou l'API pour obtenir les détails des opérations d'un lot avec le(s) statut(s) recherché(s).</p>

         <p>Il y a deux modes d'importation en lot: <code>INCREMENTAL</code> ou <code>DIFFERENTIEL</code>. Le mode incrémental permet l'ajout ou la modification de plusieurs
         ressources tandis que le mode différentiel permet de reproduire l'image réelle des ressources.  Le mode différentiel permet la suppression et elle est déterminée par
         l'absence de la ressource du lot. Les ressources du lot différentiel doivent être comprises dans un ensemble.  Plus précisément, toutes les inscriptions doivent être pour
         le même groupe (<code>idExterneEnsembleDifferentiel</code>).
         </p>

         <p>L'ordre de traitement des opérations d'un lot est important, car il garantit que la ressource respectera la dernière image reçue de ses valeurs. Pour
         cette raison, l'API traite un seul lot à la fois pour une combinaison de type et d'organisation. Une file d'attente est en place pour recevoir les lots
         à importer qui arriveraient pendant le traitement d'un lot de même type pour une organisation.</p>

         <p>Lors de la réception d'une requête, cette API effectue une recherche dans les lots existants avec l'état <code>RECEPTION_EN_COURS</code> à partir
         des valeurs <code>idUniteOrganisation</code> et <code>type</code> spécifiées. Si un lot est trouvé, la liste des opérations de ce lot sera modifiée pour
         ajouter les nouvelles opérations reçues. Autrement, un nouveau lot sera créé avec les opérations spécifiées.</p>
         <p><b>IMPORTANT</b> : Pour l'instant, une gestion minimale de la concurrence est assurée.  C'est-à-dire que le système ne traite pas adéquatement le traitement
         simultané des lots et des opérations unitaires. Il est fortement recommandé de ne faire aucune opération unitaire pendant l'exécution d'une importation en lot.</p>
         <p>
         <b>IMPORTANT</b>: La gestion minimale de l'état <code>ERREUR</code> par le système (par reprise automatique du traitement d'un lot) sera implémentée plus
         tard. D'ici à la mise en place du mécanisme, les opérations non traitées du lot en <code>ERREUR</code> devront être soumises à nouveau <b>avec leurs dernières versions</b>.
         </p>

         <p>
         <code>type</code> : Type de contenu à importer. Permet d'informer l'API des ressources qui seront importées par le lot, par exemple : des formations créditées, des groupes ou des inscriptions.<br>
         <code>idUniteOrganisation</code> : Identifiant de votre organisation. Provient de Brio et sera fourni par l'équipe Brio.<br>
         <code>envoiComplete</code> : Indicateur. Permet de savoir si le lot est complet ou non.<br>
         &nbsp;&nbsp S'il est à <code>false</code> : le lot reste en état RECEPTION_EN_COURS et aucune opération n'est traitée.<br>
         &nbsp;&nbsp S'il est à <code>true</code> : le lot passe à l'état EN_ATTENTE et il s'ajoute à la file d'attente des lots du même type à traiter pour l'organisation.<br>
         <code>modeImport</code> : mode d'importation du lot. Optionnel.<br>
          Les modes d'importation disponibles sont :
          <ol>
           <li> Le mode incrémental : permet d'ajouter ou de modifier plusieurs ressources en lot.  Valeur par défaut.</li>
           <li> Le mode différentiel : permet d'ajouter, de modifier et de supprimer des ressources afin que l'image reçue soit reproduite.</li>
          </ol>
         <code>idExterneEnsembleDifferentiel</code> : Identifiant externe de l'ensemble pour le mode différentiel.  Les ressources du lot différentiel doivent être comprises dans le même ensemble.
         Plus précisément, toutes les inscriptions doivent être pour le même groupe.<br>
         Ce paramètre devient obligatoire en mode d'import différentiel, il va permettre de définir sur quel ensemble on va effectuer
         les opérations d'ajout, de modification et de suppression.<br>
         <code>operations</code> : Liste des opérations à importer. Doit respecter l'ordre dans lequel elles doivent être traitées.
         <br/>

         ### Traitement de l'importation d'un lot <br>

         Les différentes étapes d'importation d'un lot vont comme suit : <br>
         <ol>
          <li>Pendant l'envoi des données à importer, le lot demeure dans un état <code>RECEPTION_EN_COURS</code> jusqu'à la réception de l'indicateur
          <code>envoiComplete</code> avec une valeur <code>true</code>. Aucun traitement n'est fait pendant ce temps. Les opérations qui composent le lot
          ont l'état <code>EN_ATTENTE</code>.</li>
          <li>Une fois l'envoi complété, le lot passe à l'état <code>EN_ATTENTE</code> et patiente dans la file d'attente que vienne son tour d'être traité.
          Cet état devrait être de quelques instants seulement.</li>
          <li>Lorsque son tour viendra, le lot passera à un état <code>TRAITEMENT_EN_COURS</code><b>&ast;</b>. Une après l'autre, les opérations qui le compose seront
          traitées selon le flux suivant :
              <ol type="i">
              <li>La prochaine opération avec l'état <code>EN_ATTENTE</code> est récupérée. </li>
              <li>Les paramètres de l'opération sont validés en fonction des règles d'affaires spécifiques au type d'opération et de ressource.<br>
                   En cas de non-respect des règles d'affaires, l'opération est rejetée avec un état <code>ERREUR</code>.</li>
              <li>La ressource correspondante aux paramètres de l'opération sera créée ou modifiée afin de représenter la demande.
                  L'opération passera à un état <code>SUCCES</code>.</li>
              </ol>
          </li>
          <li>Pour le mode <code>INCREMENTAL</code> :
              <ol type="i">
                  <li>Toutes les ressources du lot sont traitées en opération d'ajout ou de modification et selon l'ordre du lot.</li>
                  <li>S'il n'y a aucune opération d'ajout ou de modification en <code>ERREUR</code>, le statut du lot passe à l'état <code>COMPLETE</code>.</li>
                  <li>S'il y a au moins une opération d'ajout ou de modification en <code>ERREUR</code>, le statut du lot passe à l'état <code>COMPLETE_AVEC_ERREURS</code>. </li>
              </ol>
          </li>
          <li>Pour le mode <code>DIFFERENTIEL</code> :
              <ol type="i">
                  <li>Une validation est effectuée afin de s'assurer que toutes les ressources du lot sont dans le même ensemble (<code>idExterneEnsembleDifferentiel</code>).</li>
                  <li>Toutes les ressources du lot sont traitées en opération d'ajout ou de modification et selon l'ordre du lot.</li>
                  <li>S'il n'y a eu aucune opération d'ajout ou de modification en <code>ERREUR</code>, les opérations de suppression sont effectuées afin de reproduire l'image du lot.
                      <ol>
                          <li>S'il n'y a aucune erreur pendant la suppression, le statut du lot passe à l'état <code>COMPLETE</code>.</li>
                          <li>S'il y a des erreurs, le statut du lot passe à l'état  <code>COMPLETE_AVEC_ERREUR</code>.</li>
                      </ol>
                  </li>
                  <li>S'il y a au moins une opération d'ajout ou de modification en <code>ERREUR</code>, aucune suppression ne peut être effectuée puisqu'il y aurait une possible incohérence des données.
                  Le statut du lot passe à l'état <code>COMPLETE_AVEC_ERREURS_SANS_SUPPRESSION</code>.</li>
              </ol>
          </li>
          </ol>

          <b>&ast;</b> Dans le cas d'une exception technique survenue pendant le traitement du lot (lot en état <code>TRAITEMENT_EN_COURS</code>) :
              <ol type="i">
                  <li>Les opérations du lot, qui n'ont pas été traitées passeront à l'état <code>NON_TRAITEE</code>.</li>
                  <li>Le lot passera à l'état <code>ERREUR</code>.</li>
              </ol>




         ### Exemple (structure de base d'un appel):<br>
         <pre><code>
         POST /formations/v1/lots/
         {
              "type": "formations.LotFormationsCrediteesParams",
              "idUniteOrganisation": "123",
              "envoiComplete": false,
              "operations": [{
                  "idUniteOrganisation": "123",
                  "idExterne": "001",
                  "code": "FC-1",
                  "nom": "Formation créditée 1",
                  "idsUnitesResponsables": ["123", "456"],
                  "codeLangue": "FR",
                  "description": "Ce baccalauréat vous permettra de devenir une professionnelle ou un professionnel de l'analyse et du traitement des incidences financières du risque. Ainsi, vous mettrez à profit vos aptitudes pour les mathématiques et votre esprit créatif pour résoudre des problèmes financiers et sociaux.",
                  "typeStructure": "PROGRAMME_AVEC_ACTIVITES",
                  "formationDistance": {
                     "nombreCredits": 90,
                     "urlExterne": "https://www.ulaval.ca/etudes/programmes/baccalaureat-en-actuariat",
                     "entierementDistance": true,
                     "inscriptionEnContinu": false,
                     "niveauxFormation": [
                         "PROGRAMME_UNIVERSITAIRE_1ER_CYCLE",
                     ],
                     "idsExterneDomaine": [
                         "ADMN"
                     ],
                     "formulesEnseignement":[
                         "EN_LIGNE",
                         "COMODALE"
                      ]
                   }
              },
              {
                  "idUniteOrganisation": "123",
                  "idExterne": "002",
                  "code": "FC-2",
                  "nom": "Formation créditée 2",
                  "idsUnitesResponsables": ["456"],
                  "codeLangue": "FR",
                  "description": "Ce baccalauréat vous permettra de devenir une professionnelle ou un professionnel de l'analyse et du traitement des incidences financières du risque. Ainsi, vous mettrez à profit vos aptitudes pour les mathématiques et votre esprit créatif pour résoudre des problèmes financiers et sociaux.",
                  "typeStructure": "PROGRAMME_AVEC_ACTIVITES",
                  "formationDistance": {
                     "nombreCredits": 90,
                     "urlExterne": "https://www.ulaval.ca/etudes/programmes/baccalaureat-en-actuariat",
                     "entierementDistance": true,
                     "inscriptionEnContinu": false,
                     "niveauxFormation": [
                         "PROGRAMME_UNIVERSITAIRE_1ER_CYCLE"
                     ],
                     "idsExterneDomaine": [
                         "EDUC",
                         "SANT"
                     ],
                     "formulesEnseignement":[
                         "HYBRIDE",
                         "COMODALE"
                      ]
                   }
              }]
         }
         </code></pre>

         #### Exemple d'un appel fait avec cURL :<br>
         <pre><code>
         curl -X POST [URL] \
            -H 'Content-Type: application/json' \
            -H "Accept: application/json" \
            -d @- <<'EOF'
             {
                  "type": "formations.LotFormationsCrediteesParams",
                  "idUniteOrganisation": "123",
                  "envoiComplete": false,
